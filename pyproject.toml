[project]
name = "omilab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.0",
    "fastapi>=0.128.0",
    "fpdf2>=2.8.5",
    "greenlet>=3.3.0",
    "jinja2>=3.1.6",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.21",
    "sqlalchemy>=2.0.45",
    "uvicorn[standard]>=0.40.0",
    "bcrypt==4.3.0",
    "python-jose[cryptography]>=3.5.0",
    "python-dotenv>=1.2.1",
    "cryptography>=46.0.3",
    "pre-commit>=4.5.1",
    "commitizen>=4.12.1",
    "pydantic-settings>=2.12.0",
    "asyncpg>=0.31.0",
    "boto3>=1.42.38",
    "fastapi-mail>=1.6.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]

[tool.ruff]

line-length = 100

target-version = "py310"

[tool.ruff.lint]

select = ["E", "W", "F", "I", "UP", "B"]

fixable = ["ALL"]

ignore = []

[tool.ruff.format]

quote-style = "double"      
indent-style = "space"      
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.params.Query",
    "fastapi.Path",
    "fastapi.params.Path",
    "fastapi.Body",
    "fastapi.params.Body",
    "fastapi.Form",
    "fastapi.params.Form",
    "fastapi.File",
    "fastapi.params.File",
    "fastapi.Header",
    "fastapi.params.Header",
    "fastapi.Cookie",
    "fastapi.params.Cookie",
    "fastapi.Security",
    "fastapi.params.Security",
]

